[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stamp"
version = "0.1.0"
description = "Provenance tracking and compliance audit layer for AI-generated content."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ai-stamp contributors" }]
keywords = [
  "ai", "llm", "provenance", "compliance", "audit",
  "pii", "governance", "traceability", "tamper-detection"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Security",
]
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "pydantic>=2.0",
  "typer>=0.12",
  "alembic>=1.13",
  "pyyaml>=6.0",
  "aiosqlite>=0.19",
]

[project.optional-dependencies]
postgres = [
  "asyncpg>=0.29",
  "psycopg2-binary>=2.9",
]
nlp = [
  "spacy>=3.7",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.9",
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
aistamp = "aistamp.cli.main:app"
provenance = "aistamp.cli.main:app"

[tool.setuptools.packages.find]
include = ["aistamp*"]

[tool.setuptools.package-data]
aistamp = ["py.typed", "alembic.ini", "migrations/versions/*.py"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true

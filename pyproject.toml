[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stamp"
# Single source of truth: aistamp/__init__.py (do not bump here).
dynamic = ["version"]
description = "Provenance tracking and compliance audit layer for AI-generated content."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ai-stamp contributors" }]
keywords = [
  "ai", "llm", "provenance", "compliance", "audit",
  "pii", "governance", "traceability", "tamper-detection"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Security",
]
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "pydantic>=2.0",
  "typer>=0.12",
  "alembic>=1.13",
  "pyyaml>=6.0",
  "aiosqlite>=0.19",
]

[project.urls]
Homepage = "https://github.com/nihanthnaidu007/ai-stamp"
Repository = "https://github.com/nihanthnaidu007/ai-stamp"
Changelog = "https://github.com/nihanthnaidu007/ai-stamp/blob/main/CHANGELOG.md"
Issues = "https://github.com/nihanthnaidu007/ai-stamp/issues"

[project.optional-dependencies]
postgres = [
  "asyncpg>=0.29",
  "psycopg2-binary>=2.9",
]
nlp = [
  "spacy>=3.7",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "pytest-benchmark>=4",
  "hypothesis>=6.100",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy>=1.9",
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
aistamp = "aistamp.cli.main:app"
provenance = "aistamp.cli.main:app"

[tool.setuptools.packages.find]
include = ["aistamp*"]

[tool.setuptools.package-data]
aistamp = ["py.typed", "alembic.ini", "migrations/versions/*.py"]

[tool.setuptools.dynamic]
version = { attr = "aistamp.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
# pytest-asyncio: tests opt in per-test with @pytest.mark.asyncio (strict mode).
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "postgres: tests that require a live PostgreSQL server (AISTAMP_TEST_POSTGRES_URL)",
  "spacy: tests that require the spaCy en_core_web_sm model",
  "integration: cross-module integration tests",
  "benchmark: pytest-benchmark smoke tests on hot paths",
]
# Any new warning (ours or a dependency's) fails the suite so warnings
# cannot accumulate silently. Add narrow ignores only with a documented reason.
filterwarnings = [
  "error",
  # SQLAlchemy pools keep sqlite3.Connection objects alive until engine
  # disposal; the interpreter then emits "unclosed database" ResourceWarnings
  # at GC time, which pytest attributes to whichever test runs next (causing
  # flaky cross-test failures). The StoreBackend does not expose a public
  # dispose, so tests cannot close pooled connections deterministically.
  # Message-scoped ignore, not a blanket ResourceWarning exemption.
  "ignore:unclosed database:ResourceWarning",
  # The threaded HTTP test server closes per-connection sockets in daemon
  # request threads; their GC can land during a later test's setup. The fds
  # are already closed — this is a reaping-timing artifact, message-scoped.
  "ignore:unclosed <socket.socket:ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["aistamp"]

[tool.coverage.report]
# Ratchet gate: set ~2 points below the measured baseline so CI is green on
# day one and only tightens from here. Measured 90.35% (Python 3.13,
# 2026-09-17, PostgreSQL tests skipped locally; the CI matrix activates them,
# which only adds coverage). Raise this number when coverage improves.
fail_under = 88
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true
